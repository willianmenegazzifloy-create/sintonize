<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Obrigado por estar aqui!</title>
  <desc id="desc">A quem visita, compartilha sugestões e fortalece a comunidade: muito obrigado. Com carinho, WillianFloy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset=".58" stop-color="#5b3f8f"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <circle cx="1080" cy="150" r="190" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
    <circle cx="1080" cy="150" r="145" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
    <circle cx="1080" cy="150" r="100" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="1010" cy="74" r="4" fill="#fff" fill-opacity=".45"/>
    <circle cx="1152" cy="220" r="3" fill="#fff" fill-opacity=".5"/>
    <path d="M1080 211s-68-42-68-86c0-25 34-37 52-13 18-24 52-12 52 13 0 44-68 86-68 86z" fill="#a78bfa" fill-opacity=".72" stroke="#f4f0ff" stroke-opacity=".8" stroke-width="3" stroke-linejoin="round"/>
    <text x="64" y="72" fill="#e9ddff" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">SINTONIZE</text>
    <text x="64" y="145" fill="#fff" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="750">Obrigado por estar aqui!</text>
    <text x="64" y="190" fill="#f4f0ff" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20">A quem visita, compartilha sugestões e fortalece a comunidade:</text>
    <text x="64" y="220" fill="#f4f0ff" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20">muito obrigado.</text>
    <text x="64" y="265" fill="#e9ddff" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1">Com carinho, WillianFloy</text>
  </g>
</svg>
