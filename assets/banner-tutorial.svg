  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset=".58" stop-color="#5b3f8f"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="300" rx="24"/></clipPath>
